<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #eee;
    }

    h1 {
      margin-bottom: 16px;
      color: #4cc9f0;
      letter-spacing: 2px;
    }

    .info-bar {
      display: flex;
      gap: 32px;
      margin-bottom: 16px;
      font-size: 18px;
    }

    .info-bar span {
      background: #16213e;
      padding: 8px 20px;
      border-radius: 8px;
    }

    canvas {
      background: #16213e;
      border: 3px solid #4cc9f0;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(76, 201, 240, 0.3);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: #4cc9f0;
      color: #1a1a2e;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #6fd6f5;
    }

    .hint {
      margin-top: 16px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>

  <div class="info-bar">
    <span>得分：<b id="score">0</b></span>
    <span>最高分：<b id="highScore">0</b></span>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="controls">
    <button id="startBtn">开始游戏</button>
  </div>

  <div class="hint">使用方向键（↑ ↓ ← →）或 WASD 控制方向，按空格键暂停</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const startBtn = document.getElementById('startBtn');

    const GRID = 20;              // 格子大小（像素）
    const CELLS = 20;             // 20x20 网格
    const TICK = 120;             // 游戏速度（毫秒/步）

    let snake = [];               // 蛇身坐标数组
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = 0;
    let running = false;
    let paused = false;
    let gameLoop = null;

    // 从 localStorage 读取最高分
    try {
      highScore = Number(localStorage.getItem('snakeHighScore')) || 0;
      highScoreEl.textContent = highScore;
    } catch (e) {}

    function initGame() {
      // 蛇初始位置（中间偏左，长度 3）
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      placeFood();
    }

    function placeFood() {
      // 随机生成食物，避免落在蛇身上
      do {
        food = {
          x: Math.floor(Math.random() * CELLS),
          y: Math.floor(Math.random() * CELLS),
        };
      } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制网格
      ctx.strokeStyle = '#2a2a4a';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= CELLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // 绘制食物
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID + GRID / 2,
        food.y * GRID + GRID / 2,
        GRID / 2 - 3,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // 绘制蛇
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        ctx.fillStyle = isHead ? '#4cc9f0' : '#38b000';
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
    }

    function step() {
      // 应用新的方向（防止 180 度直接掉头）
      if (
        nextDirection.x !== -direction.x ||
        nextDirection.y !== -direction.y
      ) {
        direction = nextDirection;
      }

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y,
      };

      // 检测撞墙
      if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
        gameOver();
        return;
      }

      // 检测撞到自己（注意：尾部会移动，所以先不把尾节点算进去）
      const bodyToCheck = snake.slice(0, -1);
      if (bodyToCheck.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // 检测是否吃到食物
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        placeFood();
        // 吃到食物不删尾部，蛇变长
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      gameLoop = null;

      // 更新最高分
      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        try {
          localStorage.setItem('snakeHighScore', String(highScore));
        } catch (e) {}
      }

      // 显示结束提示
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff4d6d';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = '#eee';
      ctx.font = '16px sans-serif';
      ctx.fillText('得分：' + score + '，点击"开始游戏"重来', canvas.width / 2, canvas.height / 2 + 24);

      startBtn.textContent = '重新开始';
    }

    function start() {
      if (gameLoop) clearInterval(gameLoop);
      paused = false;
      running = true;
      initGame();
      draw();
      startBtn.textContent = '重新开始';
      gameLoop = setInterval(step, TICK);
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        clearInterval(gameLoop);
        gameLoop = null;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
      } else {
        gameLoop = setInterval(step, TICK);
      }
    }

    // 键盘控制
    document.addEventListener('keydown', (e) => {
      const key = e.key;

      if (key === ' ') {
        e.preventDefault();
        togglePause();
        return;
      }

      let newDir = null;
      switch (key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          newDir = { x: 0, y: -1 };
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          newDir = { x: 0, y: 1 };
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          newDir = { x: -1, y: 0 };
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          newDir = { x: 1, y: 0 };
          break;
      }

      if (newDir) {
        e.preventDefault();
        nextDirection = newDir;
      }
    });

    startBtn.addEventListener('click', start);

    // 初始绘制
    initGame();
    draw();
  </script>
</body>
</html>
